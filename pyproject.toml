[project]
name = "stock-radar"
version = "0.1.0"
description = "Track stock signals and evaluate their subsequent price outcomes."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.4",
    "mcp>=2.3.0",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false
required-version = "==0.12.23"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
